services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-misiva}"
      POSTGRES_USER: "${POSTGRES_USER:-misiva}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misiva} -d ${POSTGRES_DB:-misiva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-go:
    build: ./backend
    restart: unless-stopped
    environment:
      GO_HOST: "0.0.0.0"
      GO_PORT: "8080"
      DB_DRIVER: "postgres"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-misiva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-misiva}?sslmode=disable"
      APP_ORIGIN: "${APP_ORIGIN:-}"
      CORS_ALLOWED_ORIGINS: "${APP_ORIGIN:-http://localhost:3000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  misiva:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MISIVA_SERVER_PROJECTS: "1"
      GO_BACKEND_URL: "http://backend-go:8080"
      MISIVA_MCP_ALLOWED_ORIGINS: "${MISIVA_MCP_ALLOWED_ORIGINS:-}"
      APP_ORIGIN: "${APP_ORIGIN:-}"
    volumes:
      - misiva_data:/data
    depends_on:
      backend-go:
        condition: service_healthy

volumes:
  misiva_data:
  postgres_data:
