services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-misiva}"
      POSTGRES_USER: "${POSTGRES_USER:-misiva}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misiva} -d ${POSTGRES_DB:-misiva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  misiva:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MISIVA_SERVER_PROJECTS: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-misiva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-misiva}"
      MISIVA_MCP_ALLOWED_ORIGINS: "${MISIVA_MCP_ALLOWED_ORIGINS:-}"
      APP_ORIGIN: "${APP_ORIGIN:-}"
    volumes:
      - misiva_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  misiva_data:
  postgres_data:
